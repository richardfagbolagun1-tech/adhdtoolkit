# Netlify configuration for Untangle / ADHD Playbook
# Static site — no build step needed (JSX is transpiled in-browser via Babel).

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
# Keep old space-containing URLs working if anyone shared them before rename.

[[redirects]]
  from = "/ADHD%20Playbook.html"
  to = "/adhd-playbook.html"
  status = 301
  force = true

[[redirects]]
  from = "/ADHD Playbook.html"
  to = "/adhd-playbook.html"
  status = 301
  force = true

[[redirects]]
  from = "/Untangle.html"
  to = "/untangle.html"
  status = 301
  force = true

# Pretty URLs — /playbook serves the playbook without the .html
[[redirects]]
  from = "/playbook"
  to = "/adhd-playbook.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

# Long cache for CSS / JSX content files — they're versioned by filename,
# and you can bust by renaming if you ever need to.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/babel; charset=utf-8"

# Short cache on HTML so updates ship fast.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
