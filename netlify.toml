# Netlify configuration for Untangle / ADHD Playbook
# Static site — no build step needed (JSX is transpiled in-browser via Babel).

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
# Old single-page URLs now point to the cover (index.html)
[[redirects]]
  from = "/ADHD%20Playbook.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/adhd-playbook.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/untangle.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Untangle.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/playbook"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

# CSS / JSX: browsers re-check on each page load (cheap 304s via Netlify ETags),
# so every deploy shows up straight away.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/babel; charset=utf-8"

# Fonts-free vendor + images: long cache (filenames change when content does)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Short cache on HTML so updates ship fast.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
